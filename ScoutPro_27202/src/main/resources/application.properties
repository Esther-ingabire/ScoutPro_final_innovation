spring.application.name=ScoutPro_27202

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/scoutpro_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Error responses: send our ResponseStatusException messages to the client
spring.web.error.include-message=always



# Security / JWT
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-it-must-be-at-least-32-chars}
# Access token is short. A separate refresh token (see jwt.refresh-days) keeps the user signed in.
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:15}
jwt.refresh-days=${JWT_REFRESH_DAYS:7}

# Default admin, created on first startup
app.admin.email=${ADMIN_EMAIL:admin@scoutpro.rw}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}

# MongoDB (documents: scouting reports, audit and notification logs)
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/scoutpro}
spring.data.mongodb.auto-index-creation=true

# RabbitMQ (email, SMS, audit events)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}


# consumers: try 3 times (2s, then 4s apart), then send the message to its dead-letter queue
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false


# Mail. Defaults talk to Mailpit (http://localhost:8025), which never leaves this computer.
# For a real inbox, set MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD in secrets.properties
# (git-ignored). Example for Gmail: host smtp.gmail.com, port 587, AUTH and STARTTLS true,
# and MAIL_FROM equal to the Gmail address. Use an app password, not the normal password.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.mail.from=${MAIL_FROM:noreply@scoutpro.rw}

# Redis caches ranking, sports and criteria. If Redis is down, the app still answers from PostgreSQL.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Load local secrets (git-ignored) if the file exists
spring.config.import=optional:file:./secrets.properties

# Google OAuth2 login
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Where to send the user (with their JWT) after Google login
app.frontend-url=${FRONTEND_URL:http://localhost:5173}