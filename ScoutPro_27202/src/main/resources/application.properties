spring.application.name=ScoutPro_27202

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/scoutpro_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Error responses: send our ResponseStatusException messages to the client
spring.web.error.include-message=always



# Security / JWT
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-it-must-be-at-least-32-chars}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Default admin, created on first startup
app.admin.email=${ADMIN_EMAIL:admin@scoutpro.rw}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}

# MongoDB (documents: scouting reports, audit and notification logs)
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/scoutpro}
spring.data.mongodb.auto-index-creation=true

# RabbitMQ (email, SMS, audit events)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}


# consumers: try 3 times (2s, then 4s apart), then send the message to its dead-letter queue
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false


# Mail (development: Mailpit catches everything at http://localhost:8025)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
app.mail.from=${MAIL_FROM:noreply@scoutpro.rw}